resources:
  limits:
    cpus: 2.0
    memory: 512

TZ: Etc/UTC
openhabits:
  remote_host: ""
  cloudflare_api_token: ""
  public_url: ""
  trust_proxy: false
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
  https_port:
    bind_mode: published
    port_number: 8443
  networks: []

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/openhabits/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
