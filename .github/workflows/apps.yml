# Tests the two apps and the directory whenever they, or anything they
# depend on, change. The server has its own workflow (release.yml). The
# shared files in fixtures/ are read by all of them.
name: Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "apps/apple/**"
      - "apps/server/**" # the Flutter tests run against the real server code
      - "packages/core/**"
      - "services/directory/**"
      - "fixtures/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "apps/apple/**"
      - "apps/server/**" # the Flutter tests run against the real server code
      - "packages/core/**"
      - "services/directory/**"
      - "fixtures/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Same version as .fvmrc.
          flutter-version: 3.50.0
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
        working-directory: apps/client
      - run: flutter test
        working-directory: apps/client

  swift:
    # HabitsCore targets iOS and macOS 26, so it needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: apps/apple/Packages/HabitsCore

  directory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: services/directory
