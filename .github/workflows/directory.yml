# Tests the directory service (Cloudflare Worker) when it changes.
name: Directory

on:
  push:
    branches: [main]
    paths: &paths
      - "services/directory/**"
      - "fixtures/**"
      - ".github/workflows/directory.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: services/directory
