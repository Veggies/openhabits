# OpenHabits server for TrueNAS (25.04 and later).
#
# Until OpenHabits is in the TrueNAS catalog: Apps → Discover Apps → ⋮ →
# Install via YAML, and paste this file. The only line you may want to
# change is the data folder just below; it's created for you if it doesn't
# exist. Then open http://<your-nas>:8080 to finish setup.

# Where your data is kept. A dataset of its own (Datasets → Add Dataset)
# makes snapshots and backups easy, but any folder under /mnt works.
x-data: &data /mnt/tank/apps/openhabits:/data

# The "Web UI" button on the app's page in TrueNAS. 0.0.0.0 stands for the
# NAS's own address. Keep the port in step with PORT below.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 8080
    path: /

x-notes: |
  Open the Web UI to create your account, turn on remote access, and add
  your phone or computer by scanning a QR code.

services:
  # Runs once before the server: creates the data folder if needed and
  # gives it to TrueNAS's "apps" user (568), which the server runs as.
  # Without this, a new dataset belongs to root and the server can't
  # write to it.
  permissions:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown 568:568 /data"]
    volumes:
      - *data
    restart: "no"

  openhabits:
    image: ghcr.io/veggies/openhabits-server:latest
    depends_on:
      permissions:
        condition: service_completed_successfully
    # Lets "Enable remote access" ask your router to open a port (UPnP).
    network_mode: host
    user: "568:568"
    environment:
      TZ: Etc/UTC
      # If another app already uses these ports, change them here.
      PORT: "8080"
      HTTPS_PORT: "8443"
    volumes:
      - *data
    restart: unless-stopped
