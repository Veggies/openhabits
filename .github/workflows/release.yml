# Publishes a release of the server: when a version tag (e.g. v1.0.0) is
# pushed, it tests the server, then builds the image for linux/amd64 and
# linux/arm64 and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/openhabits-server. TrueNAS and the Docker Compose file
# install from there. Day-to-day tests, including checking that the image
# still builds, are in checks.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: dart:3.14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same trimmed workspace as the Dockerfile: the Flutter client would
      # need the Flutter SDK to resolve.
      - name: Resolve core + server
        run: |
          printf 'name: workspace\npublish_to: none\nenvironment:\n  sdk: ^3.14.0\nworkspace:\n  - packages/core\n  - apps/server\n' > pubspec.yaml
          dart pub get
      - run: dart analyze packages/core apps/server
      - run: dart test
        working-directory: packages/core
      - run: dart test
        working-directory: apps/server

  image:
    needs: test
    runs-on: ubuntu-24.04
    # Only this job publishes, so only it may write packages; the tests run
    # pull request code and don't need it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/openhabits-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=OpenHabits server
            org.opencontainers.image.description=Self-hosted sync server for the OpenHabits habit tracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Only tagged releases are published; other runs just prove the
          # image still builds on both architectures.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
