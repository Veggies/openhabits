# Code scanning with CodeQL. It looks for security problems in the Swift
# app, the directory service's JavaScript and these workflow files.
#
# The Swift scan has to build the app on a Mac runner, which can take a long
# time to start, so on pull requests it only runs when the Apple app changes.
# Every push to main and a weekly run still scan everything, so nothing is
# missed. The other two scans are quick and run every time.
#
# This replaces GitHub's "default setup" for code scanning, which can't skip
# languages that didn't change. Default setup has to stay turned off in the
# repository's settings (Security, then Code scanning) for this to run.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Which scans to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swift == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            swift:
              - 'apps/apple/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      # Autobuild can't find the app: its Xcode project is generated by
      # XcodeGen and isn't checked in, so autobuild only built HabitsCore and
      # the Flutter app's macOS runner. Building the app itself, the same way
      # the Checks workflow does, scans the app and HabitsCore together.
      - name: Build the Mac app
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project OpenHabits.xcodeproj -scheme OpenHabits -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath build/codeql CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
