# Runs on every pull request and every push to main. A first job works out
# which parts of the project changed, and only their checks run. The last
# job, "All checks passed", fails if any check that ran failed; that's the
# one branch protection requires, so pull requests can't be merged with
# failing tests, while skipped checks (nothing changed there) don't block.
# Modelled on Immich's test workflow (github.com/immich-app/immich).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      flutter: ${{ steps.filter.outputs.flutter == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      directory: ${{ steps.filter.outputs.directory == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      agents: ${{ steps.filter.outputs.agents == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      packaging: ${{ steps.filter.outputs.packaging == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Shared test data is read by every part, so it runs everything.
          filters: |
            server:
              - 'apps/server/**'
              - '.dockerignore'
              - 'packages/core/**'
              - 'fixtures/**'
              - 'pubspec.*'
            flutter:
              - 'apps/client/**'
              - 'apps/server/**'
              - 'packages/core/**'
              - 'fixtures/**'
              - 'pubspec.*'
            swift:
              - 'apps/apple/**'
              - 'fixtures/**'
            directory:
              - 'services/directory/**'
              - 'fixtures/**'
            packaging:
              - 'deploy/homebrew/**'
              - 'deploy/truenas/**'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            agents:
              - 'AGENTS.md'
              - 'CLAUDE.md'
            ci:
              - '.github/workflows/checks.yml'

  server:
    name: Server and core
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: dart:3.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same trimmed workspace as the Dockerfile: the Flutter client would
      # need the Flutter SDK to resolve.
      - name: Resolve core and server
        run: |
          printf 'name: workspace\npublish_to: none\nenvironment:\n  sdk: ^3.14.0\nworkspace:\n  - packages/core\n  - apps/server\n' > pubspec.yaml
          dart pub get
      - name: Formatting
        run: |
          (cd packages/core && dart format --output=none --set-exit-if-changed .)
          (cd apps/server && dart format --output=none --set-exit-if-changed .)
      - run: dart analyze packages/core apps/server
      - run: dart test
        working-directory: packages/core
      - run: dart test
        working-directory: apps/server

  flutter:
    name: Flutter app (Windows and Linux)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Same version as .fvmrc.
          flutter-version: 3.50.0
          channel: stable
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: apps/client
      - run: flutter analyze
        working-directory: apps/client
      - run: flutter test
        working-directory: apps/client

  server-image:
    name: Server image builds
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Just proves the image still builds; releases publish it (release.yml).
      - run: docker build -f apps/server/Dockerfile -t openhabits-server:check .

  swift:
    name: Apple app and core (Swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # HabitsCore and the app target iOS and macOS 26, so they need Xcode 26
    # or later. Standard macOS runners are free for public repositories.
    runs-on: macos-latest
    # Fails fast if no Mac runner picks the job up.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test
        working-directory: apps/apple/Packages/HabitsCore
      # The Xcode project isn't checked in; it's generated from project.yml.
      - run: brew install xcodegen && xcodegen generate
        working-directory: apps/apple
      # Builds the app screens for Mac and iPhone/iPad, so a change that
      # stops the app compiling can't be merged. Unsigned: CI has no
      # certificates, and nothing here ships (Xcode Cloud does releases).
      - name: Build the Mac app
        working-directory: apps/apple
        run: xcodebuild build -project OpenHabits.xcodeproj -scheme OpenHabits -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO
      - name: Build the iPhone and iPad app
        working-directory: apps/apple
        run: xcodebuild build -project OpenHabits.xcodeproj -scheme OpenHabits -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO

  directory:
    name: Directory service
    needs: changes
    if: needs.changes.outputs.directory == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
        working-directory: services/directory

  workflows:
    name: Workflow files
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint finds mistakes in workflow files (bad expressions, typos,
      # shell problems in run steps).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
      # zizmor finds security problems: actions not pinned to a commit,
      # tokens left on disk, untrusted text used as code, and so on.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --min-severity low --format github .github/workflows

  homebrew:
    name: Homebrew cask
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      # The online audit calls GitHub's API. Without a token it shares the
      # runner's anonymous limit and can fail at random. This one is
      # read-only (the workflow only has contents: read).
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Homebrew only audits casks that live in a tap, so put a copy of ours
      # in a throwaway local tap. --online also checks the download link and
      # the release, and fetch checks the sha256 matches the zip.
      - name: Check the cask the way Homebrew does
        run: |
          brew tap-new --no-git openhabits/check
          # Homebrew won't load casks from a tap until it's trusted. This tap
          # only holds our own cask, copied from this checkout.
          brew trust openhabits/check
          tap="$(brew --repository openhabits/check)"
          mkdir -p "$tap/Casks"
          cp deploy/homebrew/openhabits.rb "$tap/Casks/"
          brew style --cask openhabits/check/openhabits
          # Skips two audits meant for official Homebrew: OpenHabits 0.x
          # releases are GitHub pre-releases on purpose, and livecheck
          # ignores pre-releases, so it can't find a version to compare.
          # Our own tap installs and upgrades them fine.
          brew audit --cask --strict --online --except=github_prerelease_version,livecheck_version openhabits/check/openhabits
          brew fetch --cask openhabits/check/openhabits

  truenas:
    name: TrueNAS app
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openhabits
          persist-credentials: false
      # TrueNAS's own catalog, for the scripts its CI runs on app pull
      # requests. Tracks their main branch on purpose, so we see their
      # current checks, not an old copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: truenas/apps
          ref: master
          path: truenas-apps
          persist-credentials: false
      - name: Versions match across Homebrew and TrueNAS
        working-directory: openhabits
        run: |
          cask=$(sed -nE 's/^ *version "([^"]+)"/\1/p' deploy/homebrew/openhabits.rb)
          app=$(sed -nE 's/^app_version: *"?([^" ]+)"?/\1/p' deploy/truenas/catalog/openhabits/app.yaml)
          image=$(sed -nE '/^  image:/,/tag:/ s/^ *tag: *"?([^@" ]+).*/\1/p' deploy/truenas/catalog/openhabits/ix_values.yaml)
          echo "Homebrew cask: $cask, TrueNAS app_version: $app, TrueNAS image: $image"
          if [ -z "$cask" ] || [ "$cask" != "$app" ] || [ "$app" != "$image" ]; then
            echo "::error title=Versions don't match::The Homebrew cask, the TrueNAS app_version and the TrueNAS image tag should all be the same version."
            exit 1
          fi
      - name: Copy our entry into the catalog
        run: cp -r openhabits/deploy/truenas/catalog/openhabits truenas-apps/ix-dev/community/
      - run: python3 -c 'import yaml' || sudo apt-get install -y python3-yaml
      # The same steps TrueNAS's CI runs: check the metadata, then render the
      # template and start the app with each of our test values.
      - name: TrueNAS metadata check
        working-directory: truenas-apps
        run: python3 ./.github/scripts/check_metadata.py --train community --app openhabits
      - name: Install with host networking
        working-directory: truenas-apps
        run: python3 ./.github/scripts/ci.py --train community --app openhabits --test-file basic-values.yaml --skip-metadata
      - name: Install with bridge networking
        working-directory: truenas-apps
        run: python3 ./.github/scripts/ci.py --train community --app openhabits --test-file bridge-values.yaml --skip-metadata

  agents:
    name: Agent instructions
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CLAUDE.md only imports AGENTS.md, so every agent reads the same rules.
      # Rules kept in one agent's file would quietly drift from the others.
      - name: CLAUDE.md points to AGENTS.md
        run: |
          if [ "$(cat CLAUDE.md)" != "@AGENTS.md" ]; then
            echo "::error file=CLAUDE.md,title=Put rules in AGENTS.md::CLAUDE.md should contain only \"@AGENTS.md\". Put agent rules in AGENTS.md, so every agent follows them."
            exit 1
          fi
      # Agents follow these links, so they must lead somewhere.
      - name: Files AGENTS.md links to exist
        run: |
          missing=0
          while read -r link; do
            if [ ! -e "$link" ]; then
              echo "::error file=AGENTS.md,title=Broken link::AGENTS.md links to $link, which doesn't exist."
              missing=1
            fi
          done < <(grep -oE '\]\([^)#:]+\)' AGENTS.md | sed -E 's/^\]\(//; s/\)$//')
          exit $missing

  all-passed:
    name: All checks passed
    needs: [changes, server, server-image, flutter, swift, directory, workflows, homebrew, truenas, agents]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only "success" and "skipped" (nothing changed in that part) count as
      # passing. Anything else fails, including a job that never got a
      # runner, which GitHub doesn't always report as "cancelled".
      - name: Every check passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(if (.value.result // "") == "" then "no result" else .value.result end))"] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::These checks didn't pass: $bad. Open them above to see why. A check that never started (e.g. no Mac runner was free) can be re-run from the Checks tab."
            exit 1
          fi
          echo "Every check that ran has passed. Checks for parts that didn't change were skipped."
