# Builds and tests the server on every push and pull request. When a version
# tag (e.g. v1.0.0) is pushed, it also publishes the image to GitHub
# Container Registry as ghcr.io/<owner>/openhabits-server, for linux/amd64
# and linux/arm64. TrueNAS and the Docker Compose file install from there.
name: Server

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["apps/apple/**", "apps/client/**"]
  pull_request:
    paths-ignore: ["apps/apple/**", "apps/client/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    container: dart:3.14
    steps:
      - uses: actions/checkout@v4
      # Same trimmed workspace as the Dockerfile: the Flutter client would
      # need the Flutter SDK to resolve.
      - name: Resolve core + server
        run: |
          printf 'name: workspace\npublish_to: none\nenvironment:\n  sdk: ^3.14.0\nworkspace:\n  - packages/core\n  - apps/server\n' > pubspec.yaml
          dart pub get
      - run: dart analyze packages/core apps/server
      - run: dart test
        working-directory: packages/core
      - run: dart test
        working-directory: apps/server

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openhabits-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=OpenHabits server
            org.opencontainers.image.description=Self-hosted sync server for the OpenHabits habit tracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Only tagged releases are published; other runs just prove the
          # image still builds on both architectures.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
