# Publishes a release of the server: when a version tag (e.g. v1.0.0) is
# pushed, it tests the server, then builds the image for linux/amd64 and
# linux/arm64 and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/openhabits-server. TrueNAS and the Docker Compose file
# install from there. Day-to-day tests, including checking that the image
# still builds, are in checks.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: dart:3.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same trimmed workspace as the Dockerfile: the Flutter client would
      # need the Flutter SDK to resolve.
      - name: Resolve core + server
        run: |
          printf 'name: workspace\npublish_to: none\nenvironment:\n  sdk: ^3.14.0\nworkspace:\n  - packages/core\n  - apps/server\n' > pubspec.yaml
          dart pub get
      - run: dart analyze packages/core apps/server
      - run: dart test
        working-directory: packages/core
      - run: dart test
        working-directory: apps/server

  image:
    needs: test
    runs-on: ubuntu-24.04
    # Only this job publishes, so only it may write packages; the tests run
    # pull request code and don't need it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/openhabits-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=OpenHabits server
            org.opencontainers.image.description=Self-hosted sync server for the OpenHabits habit tracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Only tagged releases are published; other runs just prove the
          # image still builds on both architectures.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
