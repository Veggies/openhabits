# Tests the Apple apps' shared Swift package (HabitsCore) when it changes.
# The app screens themselves are built by Xcode Cloud.
name: Swift core

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/apple/Packages/**"
      - "fixtures/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # HabitsCore targets iOS and macOS 26, so it needs Xcode 26 or later.
    runs-on: macos-latest
    # Fails fast if no Mac runner picks the job up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test
        working-directory: apps/apple/Packages/HabitsCore
